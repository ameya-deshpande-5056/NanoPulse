name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Validate tag against CMake
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
            || { echo "Invalid semantic version tag: $GITHUB_REF_NAME" >&2; exit 1; }
          CMAKE_VERSION="$(grep -A3 'project(NanoPulse' CMakeLists.txt \
            | grep VERSION | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          CORE_VERSION="${VERSION%%[-+]*}"
          if [ "$CORE_VERSION" != "$CMAKE_VERSION" ]; then
            echo "Tag version $CORE_VERSION does not match CMake version $CMAKE_VERSION." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.version.outputs.value }}

  windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.value }}
    secrets: inherit

  release:
    name: Publish GitHub release
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true

      - name: Generate consolidated checksums
        run: |
          find artifacts -maxdepth 1 -type f ! -name '*.sha256' ! -name 'CHECKSUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum > artifacts/CHECKSUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: NanoPulse ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: artifacts/*
          fail_on_unmatched_files: true
